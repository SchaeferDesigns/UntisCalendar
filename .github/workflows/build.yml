name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.UNTIS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "UNTIS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          UNTIS_KEYSTORE_PASSWORD: ${{ secrets.UNTIS_KEYSTORE_PASSWORD }}
          UNTIS_KEY_ALIAS: ${{ secrets.UNTIS_KEY_ALIAS }}
          UNTIS_KEY_PASSWORD: ${{ secrets.UNTIS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk UntisKalender.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UntisKalender
          path: UntisKalender.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Untis Kalender ${{ github.run_number }}
          files: UntisKalender.apk
          make_latest: true
